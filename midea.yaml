# Board: Generic ESP8266 Board (Generic)
# Definition: definitions/boards/generic-esp8266/manifest.yaml

esphome:
  name: aire-bodner
  friendly_name: Aire Acondicionado Bodner

esp8266:
  board: esp12e
  framework:
    version: recommended

logger:
  level: INFO

api:
  encryption:
    key: "YOUR_API_ENCRYPTION_KEY"

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: LIGHT
  fast_connect: true
 
  ap:
    ssid: "aire-bodner Fallback Hotspot"
    password: "YOUR_FALLBACK_AP_PASSWORD"
    
captive_portal:

uart:
  - baud_rate: 9600
    rx_pin: GPIO14
    tx_pin: GPIO12

# REMOTE TRANSMITTER
remote_transmitter:
  - pin: GPIO13
    carrier_duty_percent: 100%

# BODNER / MIDEA AIR CONDITIONER
climate:
  - platform: midea
    name: "Aire Acondicionado Bodner"
    id: midea_ac
    autoconf: true
    icon: "mdi:air-conditioner"
    
# AVERAGE TEMPERATURE SENSOR (Home Assistant Helper)
# Imports the mean temperature calculated from two physical thermostats in Home Assistant
sensor:
  - platform: homeassistant
    id: temperatura_media_salon
    entity_id: sensor.temperatura_media_salon
    internal: true
    filters:
      - debounce: 2s # Prevents bootloops during startup
      - delta: 0.5   # Only sends Follow Me update if temp changes by at least 0.5°C
    on_value:
      then:
        - midea_ac.follow_me:
            temperature: !lambda "return x;"
            use_fahrenheit: false
            beeper: false

    name: Living Room Average Temperature
