# Board: Generic ESP8266 Board (Generic)
# Definition: definitions/boards/generic-esp8266/manifest.yaml

esphome:
  name: midea
  friendly_name: Aire Acondicionado

esp8266:
  board: esp12e
  framework:
    version: recommended

logger:
  level: INFO
  baud_rate: 0

api:
  encryption:
    key: "YOUR_API_ENCRYPTION_KEY"

ota:
  - platform: esphome
    encryption:

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  power_save_mode: LIGHT
  fast_connect: true
  ap:
    ssid: "aire-acondicion Fallback Hotspot"
    password: "PASSWORD HERE"

captive_portal:

uart:
  baud_rate: 9600
  tx_pin: GPIO12
  rx_pin: GPIO14

remote_transmitter:
  pin: GPIO13
  carrier_duty_percent: 100%

climate:
  - platform: midea
    name: "Aire Acondicionado"
    id: midea_ac
    autoconf: true
    icon: "mdi:air-conditioner"

sensor:
  - platform: homeassistant
    id: temperatura_media_salon
    entity_id: sensor.temperatura_media_salon
    internal: true
    filters:
      - throttle: 5min      # Máximo un update cada 5 minutos
      - delta: 1.0          # Solo si cambia ≥1°C respecto al anterior enviado
    on_value:
      then:
        - midea_ac.follow_me:
            temperature: !lambda "return x;"
            use_fahrenheit: false
            beeper: false

time:
  - platform: sntp
    on_time:
      - seconds: 0
        minutes: 0
        then:
          - if:
              condition:
                lambda: "return id(temperatura_media_salon).has_state();"
              then:
                - midea_ac.follow_me:
                    temperature: !lambda "return id(temperatura_media_salon).state;"
                    use_fahrenheit: false
                    beeper: false
